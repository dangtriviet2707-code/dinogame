<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DINO MMORPG — ADMIN PANEL</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,sans-serif;background:radial-gradient(circle at top,#25345f,#0b1020 60%);color:#eef4ff;min-height:100vh}.wrap{width:min(1180px,calc(100% - 28px));margin:28px auto}.card{background:#151e38eF;border:1px solid #ffffff1c;border-radius:22px;box-shadow:0 20px 70px #0008;padding:20px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}.title{font-size:28px;font-weight:1000;color:#ffdb78}.sub{color:#aebbd8;font-size:13px}.row{display:flex;gap:10px;flex-wrap:wrap}.input,button{border:1px solid #ffffff20;border-radius:12px;padding:10px 13px;background:#263254;color:#fff}.input{min-width:240px;outline:none}button{cursor:pointer;font-weight:800}button:hover{filter:brightness(1.12)}.danger{background:#542d3a}.ok{color:#7ff0b0}.bad{color:#ff9292}.status{padding:10px 12px;border-radius:12px;background:#0f1730;margin:10px 0}.table{width:100%;border-collapse:collapse;margin-top:14px}.table th,.table td{padding:10px;border-bottom:1px solid #ffffff12;text-align:left;font-size:13px}.table th{color:#ffdc83}.player{cursor:pointer}.player:hover{background:#ffffff08}.detail{margin-top:16px;display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.stat{padding:12px;border-radius:14px;background:#202b4b}.stat b{display:block;font-size:18px}.gear{padding:10px;background:#202b4b;border-radius:12px}.muted{color:#9eaccb}@media(max-width:700px){.head{align-items:flex-start;flex-direction:column}.input{width:100%;min-width:0}.table{font-size:12px}.hide-sm{display:none}}
</style></head>
<body><main class="wrap">
<section class="card" id="loginCard"><div class="title">🔐 ADMIN PANEL</div><div class="sub">Đăng nhập quản trị được xác thực hoàn toàn phía server.</div><div class="row" style="margin-top:16px"><input id="adminPw" class="input" type="password" autocomplete="current-password" placeholder="Mật khẩu Admin"><button id="login">Đăng nhập</button></div><div id="loginError" class="bad" style="margin-top:10px"></div></section>
<section class="card" id="panelCard" style="display:none"><div class="head"><div><div class="title">🦖 ADMIN PANEL</div><div class="sub">DINO MMORPG · quản trị phía server</div></div><button id="logout" class="danger">Đăng xuất</button></div><div id="status" class="status">Đang kiểm tra...</div><div class="row"><input id="search" class="input" placeholder="Tìm tên hoặc ID người chơi..."><button id="refresh">↻ Làm mới</button></div><div id="error" class="bad"></div><table class="table"><thead><tr><th>Tài khoản</th><th>Cấp</th><th>Điểm</th><th>Boss</th><th>Vật phẩm</th><th class="hide-sm">Đăng nhập cuối</th></tr></thead><tbody id="players"></tbody></table><div id="detail" class="detail"></div></section>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opt={}){const r=await fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});let j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(j.error||('HTTP '+r.status));return j}
async function loadStatus(){const j=await api('/api/admin/status');$('#loginCard').style.display='none';$('#panelCard').style.display='block';$('#status').innerHTML=`Storage: <b>${esc(j.storage.mode)}</b> · bảng: <b>${esc(j.storage.table||'local JSON')}</b> · kết nối: <b class="${j.storage.connected?'ok':'bad'}">${j.storage.connected?'OK':'LỖI'}</b>`}
async function loadPlayers(){try{const q=encodeURIComponent($('#search').value.trim());const j=await api('/api/admin/players?q='+q);$('#players').innerHTML=j.players.map(p=>`<tr class="player" data-id="${esc(p.id)}"><td><b>${esc(p.name)}</b><div class="muted">${esc(p.id)}</div></td><td>${p.level}</td><td>${p.best}</td><td>${p.bestBoss}</td><td>${p.inventoryCount}</td><td class="hide-sm">${esc(p.lastSeen||'—')}</td></tr>`).join('')||'<tr><td colspan="6">Không có người chơi.</td></tr>';document.querySelectorAll('.player').forEach(x=>x.onclick=()=>showPlayer(x.dataset.id));}catch(e){$('#error').textContent=e.message}}
async function showPlayer(id){try{const j=await api('/api/admin/player/'+encodeURIComponent(id));const p=j.player;$('#detail').style.display='block';$('#detail').innerHTML=`<h2>👤 ${esc(p.name)}</h2><div class="grid"><div class="stat">ID<b>${esc(id)}</b></div><div class="stat">Cấp<b>${p.level}</b></div><div class="stat">Điểm<b>${p.best}</b></div><div class="stat">Kinh nghiệm<b>${p.experience}</b></div><div class="stat">Boss cao nhất<b>${p.bestBoss}</b></div><div class="stat">Boss hạ<b>${p.bossKills}</b></div></div><h3>Trang bị</h3><div class="grid">${Object.entries(p.equipment||{}).map(([s,v])=>`<div class="gear"><b>${esc(s)}</b><br>${esc(v||'Chưa trang bị')}</div>`).join('')}</div><h3>Túi đồ (${(p.inventory||[]).length})</h3><div class="grid">${(p.inventory||[]).map(i=>`<div class="gear">${esc(i.icon||'🎁')} <b>${esc(i.name||i.itemId)}</b><br><span class="muted">${esc(i.rarity||'')}</span></div>`).join('')||'<div class="muted">Trống</div>'}</div>`}catch(e){$('#error').textContent=e.message}}
async function boot(){try{const c=await api('/api/server-config'); if(!c.adminConfigured){$('#loginError').textContent='SERVER CHƯA CẤU HÌNH ADMIN_PASSWORD. Vào Render → Environment và thêm ADMIN_PASSWORD, sau đó redeploy.'} else if(c.storageMode==='supabase' && !c.supabaseConfigured){$('#loginError').textContent='SERVER CHƯA CẤU HÌNH SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY.'} await api('/api/admin/status');await loadStatus();await loadPlayers()}catch(e){$('#loginCard').style.display='block';$('#panelCard').style.display='none'}}
$('#login').onclick=async()=>{try{await api('/api/admin',{method:'POST',body:JSON.stringify({password:$('#adminPw').value})});$('#loginError').textContent='';$('#adminPw').value='';await loadStatus();await loadPlayers()}catch(e){$('#loginError').textContent=e.message}};
$('#adminPw').addEventListener('keydown',e=>{if(e.key==='Enter')$('#login').click()});
$('#refresh').onclick=()=>{loadStatus();loadPlayers()};$('#search').oninput=()=>loadPlayers();$('#logout').onclick=async()=>{await api('/api/logout',{method:'POST'});location.reload()};boot();
</script></body></html>
